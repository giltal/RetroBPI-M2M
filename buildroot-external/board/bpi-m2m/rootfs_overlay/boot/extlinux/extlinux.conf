label RetroBPI-M2M
    kernel /boot/zImage
    fdt /boot/sun8i-a33-bananapi-m2m-ws5b.dtb
    # BOOT TIME: "quiet loglevel=4" suppresses the per-driver printk flood.
    # At 115200 baud every line costs real milliseconds, and the boot emits
    # hundreds -- this is the single cheapest boot-time win available.
    #
    # console=ttyS0 is deliberately KEPT. Dropping it would save more, but the
    # serial console has been the only way in on several occasions this project
    # (no display, no network, board not booting), and losing it to save a
    # fraction of a second is a bad trade while the device is still in bring-up.
    # The fast-boot pass can drop it once things are stable.
    #
    # fbcon=rotate:2 turns the boot console 180 to match the panel, which is
    # mounted upside down. Needs CONFIG_FRAMEBUFFER_CONSOLE_ROTATION (set in
    # linux-retrogaming.config). 0=normal 1=90 2=180 3=270.
    append console=ttyS0,115200 root=/dev/mmcblk0p1 rootwait panic=10 quiet loglevel=4 fbcon=rotate:2 ${extra}

# Why an explicit fdt rather than "fdtdir /boot":
#
# fdtdir makes U-Boot pick by $fdtfile, which resolves to the *stock*
# sun8i-r16-bananapi-m2m.dtb. That tree has no mmc aliases, so mmcblk indices
# are assigned in probe-completion order and the SD card lands on mmcblk0 or
# mmcblk2 depending on how the SDIO Wi-Fi race resolves. When it loses,
# root=/dev/mmcblk0p1 never appears and the kernel hangs in rootwait with no
# further output. Seen on hardware.
#
# We now boot the ws5b DTB: Waveshare 5" (B) panel, verified working at
# 800x480 (951x510 total @ 29.101 MHz). The probe DTB — same aliases, i2c0 only,
# no display nodes — stays on the card as a fallback: if the panel or the DSI
# link ever wedges the boot, point fdt back at it to get a console.
#
# Do NOT point this at the stock DTB without adding aliases to it first.

# Bring-up note: the console is deliberately verbose here. The fast-boot pass
# replaces this with "quiet loglevel=3" and no console= at all — printk at
# 115200 costs seconds of wall clock. Keep a verbose entry around for debugging.
