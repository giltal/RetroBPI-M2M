# RetroArch configuration for RetroBPI_M2M.
#
# Only the settings that must differ from RetroArch's built-in defaults are
# listed; everything else falls back to those defaults. RetroArch reads this
# file (HOME=/root is set by the /usr/bin/retroarch wrapper) in preference to
# the 34 KB skeleton at /etc/retroarch.cfg.

# Hardware GL ES on Mali-400 via Mesa/lima. Confirmed on target:
#   [GL]: Found GL context: "kms".
#   [GL]: Vendor: Mesa, Renderer: Mali400.
# This also removed the menu flicker: the plain "drm" driver kept a separate
# framebuffer for the menu and alternated page-flips with the game buffer,
# which is what "menu and game display continues to flip" was. GL composites
# the menu as a texture into the same surface, so there is only one buffer.
video_driver = "gl"

# sun8i codec via CONFIG_SND_SIMPLE_CARD; it is card 0 ("sun8i-a33-audio").
# alsathread, not alsa: the threaded ALSA driver does its writes on its own
# thread instead of inline in the emulation loop, so a core that briefly misses
# its deadline no longer starves the sound card.
#
# N64 was the only system that suffered -- it saturates this SoC and the audio
# stream was underrunning and re-preparing constantly. Measured on Mario Kart 64
# (hw_ptr going backwards = one underrun; a negative net rate means the stream
# kept resetting):
#
#   audio_driver=alsa        N64 rate -16767 Hz   <- stream repeatedly reset
#   audio_driver=alsathread  N64 rate  50040 Hz   0 xruns
#
# Checked for regressions across NES, SNES, GBA and PSX as well: all five
# systems run at the correct rate with zero xruns on alsathread, none died.
#
# This supersedes an earlier N64-only audio_latency=256 override. That traded
# ~128 ms of extra audio delay for a partial improvement (2-3 xruns); alsathread
# reaches zero xruns at the normal 128 ms, so the latency hack was removed and
# no system pays a lag penalty.
audio_driver = "alsathread"

menu_driver = "rgui"

# Waveshare 5inch DSI LCD (B). Without these RetroArch picks a size from the
# core geometry (320x240 -> 960x720) which does not fit the panel.
video_fullscreen = "true"
video_fullscreen_x = "800"
video_fullscreen_y = "480"
video_windowed_fullscreen = "false"

# Threaded video costs more than it saves at this resolution on a 1.2 GHz A7.
video_threaded = "false"

# vsync OFF -- and this does NOT cause tearing on this hardware.
#
# The sun4i DRM driver never sets mode_config.async_page_flip, and DRM core
# rejects DRM_MODE_PAGE_FLIP_ASYNC from drivers that do not advertise it
# (drm_plane.c:1408). So every page flip lands on vblank no matter what this
# setting says. Measured: ~60 flips/s with vsync either on or off.
#
# What it does change is whether RetroArch *blocks* on the flip event. Blocking
# wrecked audio -- the ALSA stream cycled RUNNING -> PREPARED -> XRUN
# continuously, because the emulator only stayed ~1900 frames ahead in a
# 3072-frame buffer and any flip jitter drained it. Measured over 24 samples:
#
#   latency  64, vsync on : 18/24 bad     latency 192, vsync on : 4/24 bad
#   latency 128, vsync on :  9/24 bad     latency 128, vsync off: 0/24 bad
#
# Bigger buffers only masked it. With vsync off the audio DMA advances 484720
# frames per 10 s against a real-time figure of 480000 -- dead on, no resets.
video_vsync = "false"

libretro_directory = "/usr/lib/libretro"

# Where the joypad profiles live. Without this RetroArch finds no autoconfig and
# logs "[Autoconf]: <pad> not configured", leaving every button unmapped in-game
# while the launcher still works (it reads evdev directly).
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
input_autodetect_enable = "true"

# --- In-game hotkeys (ported from the Lyra's retroarch.cfg) --------------
# These are MODIFIER-based: hold input_enable_hotkey_btn, then press the second
# button. Nothing happens if the modifier is not held, which is why pressing a
# face button alone appeared to "not respond".
#
# On a DualShock 3 button 10 is BTN_MODE -- the PS button -- so:
#     PS + triangle  -> RetroArch menu (save states, settings)
#     PS + START     -> exit the game, back to the launcher
#     PS + R         -> save state
#     PS + L         -> load state
#     PS + LEFT/RIGHT-> previous / next save slot
input_enable_hotkey_btn = "10"
input_menu_toggle_btn = "2"
input_exit_emulator_btn = "9"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_decrease_btn = "15"
input_state_slot_increase_btn = "16"

# In-game volume. The launcher's Settings volume is not reachable once a game
# is running, so d-pad up/down (13/14 -- still free in the scheme above) drive
# RetroArch's own gain:
#     PS + UP    -> louder
#     PS + DOWN  -> quieter
# NOTE this is RetroArch's internal audio_volume in dB, NOT the ALSA mixer, so
# it does not feed back into the launcher's Settings dial and it resets when
# RetroArch exits (config_save_on_exit is false, deliberately -- see below).
# The ALSA master remains the launcher's business.
# VOLUME IS NOT BOUND HERE ANY MORE -- volumed (S45volumed) owns it.
#
# These used to be input_volume_up_btn=13 / input_volume_down_btn=14, which
# drove RetroArch's INTERNAL audio_volume: an in-memory dB gain that is
# discarded when RetroArch exits. Every launch therefore started at full
# volume again, which is exactly the complaint (the console was too loud at
# night and turning it down never stuck).
#
# It could not be persisted either: config_save_on_exit is off deliberately
# (see below -- it rewrote audio_driver to "null"), RetroArch never logs the
# volume so there is nothing to scrape, and parallel-n64 SIGSEGVs on teardown
# so an on-exit save would miss N64 anyway.
#
# volumed watches the pad directly and moves the ALSA 'Headphone' control
# instead, which S35alsa already persists via alsactl store/restore. Same
# buttons (PS + d-pad up/down), but the setting survives both the game exiting
# and a reboot.
#
# LEAVING THESE BOUND WOULD DOUBLE-APPLY every press -- once in the mixer and
# once in RetroArch's software gain. That is why they are removed, not merely
# duplicated.

# --- RetroArch rewrites this file on exit ------------------------------
# Every setting edited here was being silently reverted on the next run --
# audio_driver kept going back to "null" and audio_device to "". Turning the
# save off is what made any of the audio configuration stick.
config_save_on_exit = "false"

# --- Audio -------------------------------------------------------------
# The sun8i codec is card 0. Pin the device and the output rate: cores ask for
# odd rates (gambatte wants 32917.50 Hz after rate control) that the codec will
# not accept, and RetroArch then fails audio init entirely rather than
# resampling. 48000 is confirmed working with speaker-test.
audio_device = "hw:0,0"
audio_out_rate = "48000"

# 128 ms of buffer. The 64 ms default leaves too little headroom to absorb
# frame-time jitter; see the vsync note above for the measurements.
audio_latency = "128"

# --- Per-core overrides -------------------------------------------------
# Some cores need settings that only make sense for them, and shipping them as
# files under config/<Core Name>/ only works if RetroArch is told to look:
#
#   config/MAME 2003-Plus/MAME 2003-Plus.cfg  analog stick -> d-pad, so the
#                                             DS3's sticks drive arcade games
#   config/fuse/fuse.cfg                      libretro device 513 = Sinclair
#                                             joystick, otherwise the Spectrum
#                                             sees no input at all
#   ...and the matching .opt files for core options.
#
# Without auto_overrides_enable those files are dead weight -- RetroArch reads
# neither, reports nothing, and the cores just behave wrongly. global_core_options
# must be false too, or core options come from one shared file instead of the
# per-core .opt.
auto_overrides_enable = "true"
global_core_options = "false"
game_specific_options = "true"
core_option_category_enable = "true"
rgui_config_directory = "/root/.config/retroarch/config"

# --- Panel orientation ---------------------------------------------------
# The panel is mounted upside down in the case. See rotation = <180> in
# kernel/sun8i-a33-bananapi-m2m-ws5b.dts, which records the hardware fact;
# every consumer compensates for it separately because sun4i-drm has no
# hardware rotation and there is no single knob all of them read.
#
# NOT set here. video_rotation is a CONTENT rotation -- RetroArch applies it
# to the game frame only, while the menu, OSD and gfx_display widgets draw with
# an unrotated matrix on purpose (so they stay upright when a vertical arcade
# game rotates). Setting it to 2 rotated games but left the RGUI menu and
# on-screen messages inverted, which is exactly what was seen on hardware.
#
# The display rotation is instead folded into the base projection by patch
# 0007, so everything inherits it and core rotation still composes on top.
# Leaving this at 0 keeps video_rotation meaning what it normally means.
video_rotation = "0"

# --- BIOS / system files ------------------------------------------------
# Where cores look for BIOS images. Pointed at the FAT partition on purpose:
# /opt/roms is the partition you can mount on a PC, so a BIOS can be dropped in
# without reflashing or shelling into the device.
#
# PlayStation needs a real BIOS (e.g. SCPH1001.BIN). pcsx_rearmed has an HLE
# fallback that boots some titles and fails on many, so the real file is worth
# having. It is copyrighted Sony code and is deliberately NOT shipped in this
# image -- supply your own.
system_directory = "/opt/roms/_system/bios"
