ctrl_interface=/var/run/wpa_supplicant
update_config=1

# No network configured yet, so S49wifi skips Wi-Fi entirely and the board
# boots at full speed. To join a network, on the board:
#
#   wpa_passphrase "MySSID" "mypassphrase" >> /etc/wpa_supplicant.conf
#   /etc/init.d/S49wifi restart
#
# That appends a network={...} block with a hashed PSK. The script keys off
# an "ssid=" line appearing in this file.
